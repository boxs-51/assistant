# config/default.yaml
# Cấu hình mặc định cho AI Gateway.
# Các giá trị ở đây sẽ bị ghi đè bởi các file môi trường (e.g., production.yaml) và biến môi trường.

storage:
  drivers:
    redis:
      enabled: true
      url: "redis://localhost:6379/0"
    sqlite:
      enabled: true
      path: "data/gateway_storage.db"
    chroma:
      enabled: true
      path: "data/gateway_chroma"


gateway:
  name: "AI Gateway"
  version: "1.0.0"
  host: "0.0.0.0"
  port: 8000
  debug: false

oauth:
  google:
    client_id: "change-me"
    client_secret: "change-me"
  github:
    client_id: "change-me"
    client_secret: "change-me"


frontend:
  oauth_callback_url: "http://localhost:8000/auth/oauth/callback"

auth:
  enable: False

  jwt_secret_key: "change-me"
  jwt_algorithm: "HS256"
  jwt_expiration: 3600

  access_token_expire_minutes: 30
  refresh_token_expire_days: 30

rate_limit:
  algorithm: "token_bucket"
  capacity: 100
  refill_rate: 5.0
  limit: 100
  window_size: 60
  fail_mode: "open"

circuit_breaker:
  default:
    failure_threshold: 3
    reset_timeout: 30 # Thời gian chờ dài hơn cho các LLM provider
    success_threshold: 1
  providers:
    redis_rate_limiter:
      failure_threshold: 2 # Ngưỡng thấp hơn cho Redis
      reset_timeout: 5     # Thời gian reset ngắn hơn
      success_threshold: 1


provider:
  timeout: 60
  retry: 2
  enable_fallback: true
  priority: ["openai", "anthropic", "gemini", "ollama"]
  routing_rules_path: "config/gateway/routing/routing_rules.yaml"

openai:
  api_key: ""
  base_url: "https://api.openai.com/v1"

anthropic:
  api_key: ""
  base_url: "https://api.anthropic.com"

gemini:
  api_key: ""
  base_url: "https://generativelanguage.googleapis.com"

ollama:
  base_url: "http://127.0.0.1:11434"

logging:
  level: "INFO"
  file: "gateway.log"

metrics:
  enable: true
  port: 9090

tracing:
  enable: false
  otlp_endpoint: "http://localhost:4318"