# Bộ lọc che mờ thông tin cá nhân và bí mật hệ thống
name: PII and Secrets Redaction
description: Các pattern để tìm và che mờ thông tin nhạy cảm như PII, API Keys, và credentials.

output_redaction:
  "OpenAI API Key": r"sk-(proj-)?[a-zA-Z0-9]{20}T3BlbkFJ[a-zA-Z0-9]{20}"
  "HuggingFace Token": r"hf_[a-zA-Z0-9]{30,}"
  "Google API Key": r"AIza[0-9A-Za-z\-_]{35}"
  "AWS Access Key ID": r"AKIA[0-9A-Z]{16}"
  "Generic API Key": r"\b(api|secret|access)[_-]?key\b\s*[:=]\s*['\"]?([a-zA-Z0-9\-_.]+)['\"]?"
  "Bearer Token": r"Bearer\s+[a-zA-Z0-9\-_.]+"
  "JWT Token": r"ey[a-zA-Z0-9\-_]+\.ey[a-zA-Z0-9\-_]+\.[a-zA-Z0-9\-_]+"
  "Email Address": r"\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Z|a-z]{2,}\b"
  "Phone Number (VN)": r"\b(0|\+84)[35789]\d{8}\b"
  "Credit Card Number": r"\b(?:\d[ -]*?){13,16}\b"
  "Database Connection String": r"(postgres|mysql|mongodb(?:\+srv)?)://[^:]+:[^@]+@[^/]+/"
  "Password": r"(password|passwd|pwd)\s*[:=]\s*['\"]?([^'\"\s]+)['\"]?"
