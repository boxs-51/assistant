name: SBX3 Pytest Skip Evidence Nonproduction

on:
  push:
    branches:
      - audit/sbx3-pytest-skip-evidence-20261017

permissions:
  contents: read

jobs:
  linux-pytest-skip-provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check out exact parent PR source
        shell: bash
        run: |
          set -euo pipefail
          echo "EVIDENCE_COMMIT=$(git rev-parse HEAD)"
          echo "PR_SOURCE_TREE_PARENT=$(git rev-parse HEAD^)"
          test "$(git rev-parse HEAD^)" = "8f847ee754f034660c44ef55772b5606ed607e2a"
          git diff --name-only HEAD^ HEAD
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/sbx3-pytest-skip-evidence-20261017.yml"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: |
            requirements-test.txt
            requirements.txt
            requirements-runtime.txt
      - name: Install exact baseline test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Full unmodified pytest suite with skip reasons and JUnit evidence
        shell: bash
        run: |
          mkdir -p evidence/sbx3-pytest-skip
          python -m pytest -q -ra --junitxml=evidence/sbx3-pytest-skip/pytest.xml 2>&1 | tee evidence/sbx3-pytest-skip/pytest-console.log
          exit "${PIPESTATUS[0]}"
      - name: Enumerate exact skipped JUnit cases without altering verdict
        if: always()
        shell: python
        run: |
          from pathlib import Path
          import json
          import xml.etree.ElementTree as ET
          p = Path("evidence/sbx3-pytest-skip/pytest.xml")
          if not p.is_file():
              print("EVIDENCE_ERROR: JUnit not produced")
              raise SystemExit(2)
          root = ET.parse(p).getroot()
          cases = list(root.iter("testcase"))
          skipped = []
          for case in cases:
              for node in case.findall("skipped"):
                  item = {
                      "classname": case.attrib.get("classname", ""),
                      "name": case.attrib.get("name", ""),
                      "file": case.attrib.get("file", ""),
                      "line": case.attrib.get("line", ""),
                      "reason": node.attrib.get("message", ""),
                      "trace": (node.text or "")[:1400],
                  }
                  skipped.append(item)
                  print("SKIP_CASE_JSON " + json.dumps(item, ensure_ascii=False))
          stats = {
              "junit_testcase_count": len(cases),
              "skipped_testcase_count": len(skipped),
              "failed_testcase_count": sum(bool(t.find("failure") is not None) for t in cases),
              "error_testcase_count": sum(bool(t.find("error") is not None) for t in cases),
          }
          print("SKIP_AUDIT_COUNTS " + json.dumps(stats))
          Path("evidence/sbx3-pytest-skip/skip-inventory.json").write_text(
              json.dumps({"stats": stats, "skipped": skipped}, indent=2),
              encoding="utf-8",
          )
      - name: Upload unmodified raw log, JUnit, and skip inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbx3-pytest-skip-evidence-linux
          path: evidence/sbx3-pytest-skip/
          if-no-files-found: error
