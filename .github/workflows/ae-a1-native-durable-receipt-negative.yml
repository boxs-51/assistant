name: AE A1 Native Durable Receipt Negative Gates

on:
  pull_request:
    paths:
      - "se/src/runtimes/agent/native_receipt_verifier.py"
      - "se/src/runtimes/agent/persistence.py"
      - "se/src/runtimes/agent/runtime.py"
      - "se/src/runtimes/agent/recovery_execution.py"
      - "se/src/runtimes/agent/resume_planning.py"
      - "se/src/runtimes/agent/safe_point_reconstruction.py"
      - "se/tests/architecture/test_ae_a1_native_durable_receipt_failclosed.py"
      - "se/tests/architecture/ae_a1_pg17_receipt_evidence.py"
      - "docs/agent_execution_r14/R14_E_A1_NATIVE_DURABLE_RECEIPT_FENCE.md"
      - ".github/workflows/ae-a1-native-durable-receipt-negative.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  receipt-negative:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: |
            requirements-test.txt
            requirements.txt
            requirements-runtime.txt
      - name: Install baseline test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Run strict AE native pre-COMMITTED/readthrough negatives
        run: >-
          python -m pytest -q -ra
          se/tests/architecture/test_ae_a1_native_durable_receipt_failclosed.py
          se/tests/architecture/test_r7_c_tool_result_commitment.py
      - name: Audit working tree for accidental native activation
        run: >-
          python -c "from pathlib import Path;
          p=Path('se/src/runtimes/agent/native_receipt_verifier.py');
          s=p.read_text(encoding='utf-8');
          assert 'raise NativeReceiptUnavailable(phase)' in s;
          assert 'terminal.run' in s and 'terminal.launch' in s
          and 'python.run' in s;
          print('AE_NATIVE_PRODUCTION_ACTIVATION=DENIED')"

  pg17-native-receipt-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root
          POSTGRES_DB: ae_a1_receipt
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ae_a1_receipt"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      AE_A1_POSTGRES_URL: postgresql+asyncpg://postgres:root@127.0.0.1:5432/ae_a1_receipt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
      - name: Install requirements and real asyncpg
        run: |
          python -m pip install -r requirements-test.txt
          python -m pip install asyncpg==0.32.0
      - name: Create evidence parent
        run: python -c "from pathlib import Path; Path('evidence/a1-pg17').mkdir(parents=True,exist_ok=True)"
      - name: Genuine PostgreSQL17 pre-COMMITTED and restart negative
        run: >-
          python -m pytest -q -ra
          --basetemp=evidence/a1-pg17/linux
          --junitxml=evidence/a1-pg17/linux-junit.xml
          se/tests/architecture/ae_a1_pg17_receipt_evidence.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ae-a1-pg17-linux
          path: evidence/a1-pg17
          if-no-files-found: warn

  pg17-native-receipt-windows:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      AE_A1_POSTGRES_URL: postgresql+asyncpg://postgres:root@127.0.0.1:5432/ae_a1_receipt
      PGPASSWORD: root
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
      - name: Start native PostgreSQL 17 Windows service and test database
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $service = Get-Service -Name 'postgresql-x64-17' -ErrorAction Stop
          Set-Service -Name $service.Name -StartupType Manual
          Start-Service -Name $service.Name
          $service = Get-Service -Name $service.Name
          if ($service.Status -ne 'Running') { throw "Native PostgreSQL17 service not running" }
          $psql = Join-Path $env:PGBIN 'psql.exe'
          if (!(Test-Path $psql)) { throw "PostgreSQL17 psql binary unavailable" }
          $version = & $psql -h 127.0.0.1 -U postgres -d postgres -tAc "SHOW server_version_num"
          if ($LASTEXITCODE -ne 0 -or [int]($version.Trim()) -lt 170000 -or [int]($version.Trim()) -ge 180000) {
            throw "Real PostgreSQL17 server version failed: $version"
          }
          & $psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE ae_a1_receipt"
          if ($LASTEXITCODE -ne 0) { throw "Native PG17 database setup failed" }
      - name: Install requirements and real asyncpg
        run: |
          python -m pip install -r requirements-test.txt
          python -m pip install asyncpg==0.32.0
      - name: Create evidence parent
        run: python -c "from pathlib import Path; Path('evidence/a1-pg17').mkdir(parents=True,exist_ok=True)"
      - name: Genuine PostgreSQL17 pre-COMMITTED and restart negative
        run: >-
          python -m pytest -q -ra
          --basetemp=evidence/a1-pg17/windows
          --junitxml=evidence/a1-pg17/windows-junit.xml
          se/tests/architecture/ae_a1_pg17_receipt_evidence.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ae-a1-pg17-windows
          path: evidence/a1-pg17
          if-no-files-found: warn
