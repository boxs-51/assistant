name: AE359 Remote Terminal Error No-Retry Two-OS

on:
  pull_request:
    paths:
      - "se/src/runtimes/capability/runtime.py"
      - "se/tests/architecture/test_ubq3_outcome_evidence.py"
      - ".github/workflows/ae359-terminal-remote-error-two-os.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terminal-error-no-retry:
    name: remote-terminal-clamp (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: |
            requirements-test.txt
            requirements.txt
            requirements-runtime.txt
      - name: Install pinned test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Create evidence directory
        run: python -c "from pathlib import Path; Path('evidence/ae359-remote-terminal-clamp').mkdir(parents=True, exist_ok=True)"
      - name: Test terminal error and uncertain timeout retry clamps
        run: >-
          python -m pytest -q -ra
          --junitxml=evidence/ae359-remote-terminal-clamp/junit.xml
          se/tests/architecture/test_ubq3_outcome_evidence.py::test_ubq3_remote_terminal_error_untrusted_retry_hint_is_clamped
          se/tests/architecture/test_ubq3_outcome_evidence.py::test_ubq3_remote_timeout_unknown_does_not_refund
      - name: Strict JUnit exactly three cases
        run: >-
          python -c "import xml.etree.ElementTree as ET;
          root=ET.parse('evidence/ae359-remote-terminal-clamp/junit.xml').getroot();
          suites=[root] if root.tag=='testsuite' else list(root.findall('testsuite'));
          assert len(suites)==1 and
          int(suites[0].attrib.get('tests','0'))==3 and
          all(int(suites[0].attrib.get(k,'0'))==0 for k in ('failures','errors','skipped'));
          print('AE359_TERMINAL_REMOTE_ERROR=3_PASS_0_SKIP; PORTABLE_NOT_DURABLE_EFFECT_FENCE')"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ae359-terminal-clamp-${{ matrix.os }}
          path: evidence/ae359-remote-terminal-clamp
          if-no-files-found: error
