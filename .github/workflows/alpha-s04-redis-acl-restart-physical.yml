name: Alpha S04 Redis ACL durable restart physical gate

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  s04-redis-acl-restart:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      S04_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONIOENCODING: utf-8
      S04_ACL_RESTART_STRICT: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
      - run: python -m pip install -r requirements-test.txt
      - name: Attest SHA, runner and disposable Docker
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$S04_EXPECTED_HEAD"
          printf 'S04_EXACT_HEAD=%s\n' "$(git rev-parse HEAD)"
          test "S04_ACL_RESTART_STRICT" = "S04_ACL_RESTART_STRICT" # static source-path canary
          docker version
          docker info --format '{{.ServerVersion}}'
      - name: Execute four exact Redis ACL durable restart physical cases
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -vv -ra --tb=short \
            se/tests/integration/test_alpha_s04_acl_restart_sentinel_physical.py \
            -k test_s04_acl_restart_writer_epoch_persistence \
            --junitxml=s04-acl-restart.xml
      - name: Fail closed on JUnit identity, suite failures and skips
        if: always()
        shell: python
        run: |
          from collections import Counter
          from pathlib import Path
          import xml.etree.ElementTree as ET
          path = Path("s04-acl-restart.xml")
          assert path.is_file(), "S04_HARNESS_ERROR: raw JUnit missing"
          root = ET.parse(path).getroot()
          assert root.tag in ("testsuite", "testsuites"), "S04_HARNESS_ERROR: JUnit root"
          suites = [root] if root.tag == "testsuite" else list(root.findall("testsuite"))
          assert len(suites) == 1, "S04_HARNESS_ERROR: expected one physical suite"
          tests = list(suites[0].findall("testcase"))
          expected = Counter({
              "test_s04_acl_restart_writer_epoch_persistence[saved-registration]": 1,
              "test_s04_acl_restart_writer_epoch_persistence[saved-password_reset]": 1,
              "test_s04_acl_restart_writer_epoch_persistence[unsaved-control-registration]": 1,
              "test_s04_acl_restart_writer_epoch_persistence[unsaved-control-password_reset]": 1,
          })
          assert Counter(t.attrib.get("name", "") for t in tests) == expected, (
              "S04_HARNESS_ERROR: missing/duplicate physical scenario identity"
          )
          assert len(tests) == 4, "S04_HARNESS_ERROR: unexpected JUnit count"
          for case in tests:
              classname = case.attrib.get("classname", "").replace(".", "/")
              assert classname.endswith(
                  "test_alpha_s04_acl_restart_sentinel_physical"
              ), "S04_HARNESS_ERROR: foreign testcase source"
          assert all(suites[0].attrib.get(k) == v for k, v in {
              "tests": "4", "failures": "0", "errors": "0", "skipped": "0"
          }.items()), "S04_SEMANTIC_RED_OR_HARNESS_ERROR: inspect raw JUnit"
          assert all(case.find(tag) is None for case in tests
                     for tag in ("failure", "error", "skipped")), (
              "S04_SEMANTIC_RED_OR_HARNESS_ERROR: physical case failed/skipped"
          )
          print("S04_S04_REDIS_ACL_RESTART_4_CASES_PASS")
      - name: Always publish exact raw JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s04-acl-restart-raw
          path: s04-acl-restart.xml
          if-no-files-found: error
