name: AE359 Logout Cache RED-First (Evidence Only)

# Unfiltered PR trigger: these security jobs must not disappear due to path filters.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  red-first-actual-backend:
    name: AE359 logout RED witness / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: |
            requirements-test.txt
            requirements.txt
            requirements-runtime.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: "RED-first: real auth chain and redis-py socket failures (EXPECTED TO FAIL)"
        run: >-
          python -m pytest -q -ra
          se/tests/integration/test_ae359_logout_cache_redfirst.py
          --junitxml=ae359-logout-cache-red.xml
      - name: Preserve raw RED-first JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ae359-logout-red-${{ matrix.os }}
          path: ae359-logout-cache-red.xml
          if-no-files-found: warn
