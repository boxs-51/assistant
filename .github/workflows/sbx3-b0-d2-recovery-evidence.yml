name: SBX3 B0 D2 Recovery and Fence Evidence

on:
  pull_request:
    paths:
      - "se/src/runtimes/capability/native_tree_recovery_b0.py"
      - "se/src/runtimes/capability/sandbox.py"
      - "se/src/runtimes/capability/runtime.py"
      - "se/src/runtimes/agent/**"
      - "se/tests/architecture/test_sbx3_d2_recovery_fences.py"
      - ".github/workflows/sbx3-b0-d2-recovery-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-real-hard-crash-negative:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
      - name: Install pinned test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Run real hard crash, OS tree negative, CRT/AE/root gates
        run: python -m pytest -q -ra se/tests/architecture/test_sbx3_d2_recovery_fences.py --junitxml=sbx3-d2-legacy-junit.xml
      - name: Verify exact D2 root custody oracle identity and preserve raw JUnit
        if: always()
        shell: python
        run: |
          from collections import Counter
          from pathlib import Path
          from xml.etree import ElementTree as ET
          source = Path("sbx3-d2-legacy-junit.xml")
          assert source.is_file(), "HARNESS_ERROR: legacy D2 raw JUnit missing"
          cases = list(ET.parse(source).getroot().iter("testcase"))
          case_names = Counter(c.get("name", "").split("[", 1)[0] for c in cases)
          expected = ["test_manager_native_root_quarantined_until_authority_readback","test_restart_reattach_quarantines_native_root_until_os_proof","test_restart_with_missing_os_scope_never_adopts_or_deletes_root","test_manager_rejects_foreign_native_binding_before_spawn"]
          assert len(cases) == 15, ("HARNESS_ERROR: legacy D2 case count changed", len(cases))
          assert all(case_names[name] == 1 for name in expected), (
              "HARNESS_ERROR: missing/duplicate D2 custody oracle", case_names
          )
          failures = {
              key: sum(c.find(key) is not None for c in cases)
              for key in ("failure", "error", "skipped")
          }
          assert all(n == 0 for n in failures.values()), ("D2_NEGATIVE_RED", failures)
          print("D2_ROOT_CUSTODY=4_PASS; 15_CASES_TOTAL; NO_OS_VERIFIED_EMPTY_CLAIM")
      - name: Upload raw D2 legacy custody evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbx3-d2-legacy-${{ runner.os }}
          path: sbx3-d2-legacy-junit.xml
          if-no-files-found: error
      - name: Record native B0 certification limits
        if: always()
        run: |
          echo "SBX3_D2_OS_TREE_REATTACH_POSITIVE=NOT_CERTIFIED"
          echo "SBX3_D2_AGENT_ACTIVATION=DENY"
          echo "SBX3_D2_VERIFIED_EMPTY_FROM_FAKE_OS=FORBIDDEN"

  windows-real-hard-crash-negative:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
      - name: Install pinned test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Run real Windows hard crash and fail-closed path
        run: python -m pytest -q -ra se/tests/architecture/test_sbx3_d2_recovery_fences.py --junitxml=sbx3-d2-legacy-junit.xml
      - name: Verify exact D2 root custody oracle identity and preserve raw JUnit
        if: always()
        shell: python
        run: |
          from collections import Counter
          from pathlib import Path
          from xml.etree import ElementTree as ET
          source = Path("sbx3-d2-legacy-junit.xml")
          assert source.is_file(), "HARNESS_ERROR: legacy D2 raw JUnit missing"
          cases = list(ET.parse(source).getroot().iter("testcase"))
          case_names = Counter(c.get("name", "").split("[", 1)[0] for c in cases)
          expected = ["test_manager_native_root_quarantined_until_authority_readback","test_restart_reattach_quarantines_native_root_until_os_proof","test_restart_with_missing_os_scope_never_adopts_or_deletes_root","test_manager_rejects_foreign_native_binding_before_spawn"]
          assert len(cases) == 15, ("HARNESS_ERROR: legacy D2 case count changed", len(cases))
          assert all(case_names[name] == 1 for name in expected), (
              "HARNESS_ERROR: missing/duplicate D2 custody oracle", case_names
          )
          failures = {
              key: sum(c.find(key) is not None for c in cases)
              for key in ("failure", "error", "skipped")
          }
          assert all(n == 0 for n in failures.values()), ("D2_NEGATIVE_RED", failures)
          print("D2_ROOT_CUSTODY=4_PASS; 15_CASES_TOTAL; NO_OS_VERIFIED_EMPTY_CLAIM")
      - name: Upload raw D2 legacy custody evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbx3-d2-legacy-${{ runner.os }}
          path: sbx3-d2-legacy-junit.xml
          if-no-files-found: error
      - name: Record native Windows certification limits
        if: always()
        shell: pwsh
        run: |
          Write-Output "SBX3_D2_WINDOWS_APPCONTAINER=NOT_IMPLEMENTED"
          Write-Output "SBX3_D2_WINDOWS_OS_TREE_REATTACH=NOT_CERTIFIED"
          Write-Output "SBX3_D2_AGENT_ACTIVATION=DENY"
