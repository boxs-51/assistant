name: AIC31b Unified Exact-HEAD PG17 Linux Windows

on:
  push:
    branches:
      - evidence/156-426-aic31b-unified-pg17-gates-20261014
  pull_request:
    paths:
      - ".github/workflows/aic31b-unified-pg17-exact-head.yml"
  workflow_dispatch:

permissions:
  contents: read

# Full test-only proof on ONE exact checkout of composed PR494/496/504/506/509/511
# plus the narrow PR518 CLI SQLSTATE remediation. Does NOT activate migrations
# in production, approve admissions, alter canonical PR467, or authorize merge.
# CI runner roles/databases must be disposable; actual production stays HOLD.
jobs:
  postgresql17-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root
          POSTGRES_DB: aic_p1a
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aic_p1a"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      AIC_TEST_POSTGRES_URL: postgresql+asyncpg://postgres:root@127.0.0.1:5432/aic_p1a
      AIC31B_EPHEMERAL_REHEARSAL: "1"
      AIC31B_EPHEMERAL_CRASH: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # pinned historical PR467 31a blob is mandatory
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
      - name: Install real PG and suite dependencies
        run: |
          python -m pip install -r requirements-test.txt
          python -m pip install asyncpg==0.32.0
      - name: Require actual PostgreSQL 17 server (no sqlite fallback)
        shell: bash
        run: |
          python -c 'import asyncio,os,asyncpg
          from sqlalchemy.engine.url import make_url
          async def check():
              u=make_url(os.environ["AIC_TEST_POSTGRES_URL"])
              c=await asyncpg.connect(host=u.host,port=u.port or 5432,user=u.username,password=u.password,database=u.database)
              try:
                  v=int(await c.fetchval("SHOW server_version_num"))
                  print("Real PG server_version_num:",v,flush=True)
                  assert 170000<=v<180000,"PostgreSQL 17 required"
              finally:
                  await c.close()
          asyncio.run(check())'
      - name: Run AIC integration and architecture matrix, strict no skips
        shell: bash
        run: |
          mkdir -p aic467-pg17-evidence
          python -m pytest -q -ra \
            --junitxml=aic467-pg17-evidence/linux-junit.xml \
            -k "not full_historical_alembic_chain_with_ubq25_26_and_live_owner" \
            se/tests/integration/test_aic0_p1_agent_instance_identity.py \
            se/tests/architecture/test_aic0_p1_identity_production_boundary.py
          python -c 'from xml.etree import ElementTree as E; r=E.parse("aic467-pg17-evidence/linux-junit.xml").getroot(); suites=[r] if r.tag=="testsuite" else r.findall("testsuite"); print([(x.get("tests"),x.get("failures"),x.get("errors"),x.get("skipped")) for x in suites]); assert all(int(x.get("skipped","0"))==0 and int(x.get("failures","0"))==0 and int(x.get("errors","0"))==0 for x in suites); assert sum("test_aic_pg17_hard_exit_live_and_permanent_marker" in c.get("name","") for s in suites for c in s.findall("testcase"))==3, "three native PG17 OS-kill tests REQUIRED"; assert sum("test_aic_pg17_forward_old31a_guard_and_restart" in c.get("name","") for s in suites for c in s.findall("testcase"))==1, "historical 31a -> 31b native PG17 repair gate REQUIRED"'
          python -m pytest -q -ra --junitxml=aic467-pg17-evidence/linux-history-sqlite.xml "se/tests/integration/test_aic0_p1_agent_instance_identity.py::test_aic_full_historical_alembic_chain_with_ubq25_26_and_live_owner[sqlite]"
          python -c 'from xml.etree import ElementTree as E; r=E.parse("aic467-pg17-evidence/linux-history-sqlite.xml").getroot(); ss=[r] if r.tag=="testsuite" else r.findall("testsuite"); assert len(ss)==1 and all(int(ss[0].get(k,"0"))==v for k,v in {"tests":1,"failures":0,"errors":0,"skipped":0}.items()), "real SQLite historical gate must be exactly one PASS with zero skips"'
      - name: Require composed 31a-31b, real reader-writer and pre/post-commit OS cuts
        shell: bash
        run: |
          python -m pytest -q -ra --junitxml=aic467-pg17-evidence/linux-composed.xml se/tests/integration/test_aic0_31b_composed_alembic.py
          python -m pytest -q -ra --junitxml=aic467-pg17-evidence/linux-quiescence.xml se/tests/integration/test_aic0_31b_quiescence_rehearsal.py
          python -m pytest -q -ra --junitxml=aic467-pg17-evidence/linux-interrupt.xml se/tests/integration/test_aic0_31b_cli_interrupt.py
          python -c 'from xml.etree import ElementTree as E; expected={"composed":["test_composed_pg17_cli_old_stamped_31a_to_31b","test_composed_pg17_cli_pristine_ubq_history_to_31b"],"quiescence":["test_pg17_ephemeral_login_barrier_drain_and_old31a_forward[reader]","test_pg17_ephemeral_login_barrier_drain_and_old31a_forward[writer]"],"interrupt":["test_pg17_interrupted_31b_cli_fail_closed[after_commit]","test_pg17_interrupted_31b_cli_fail_closed[before_commit]"]}; suites={n:next(iter(E.parse("aic467-pg17-evidence/linux-"+n+".xml").getroot().iter("testsuite"))) for n in expected}; print({n:(suites[n].get("tests"),suites[n].get("failures"),suites[n].get("errors"),suites[n].get("skipped")) for n in expected}); assert all(int(suites[n].get("tests","-1"))==len(expected[n]) and all(int(suites[n].get(k,"0"))==0 for k in ("failures","errors","skipped")) and sorted(x.get("name") for x in suites[n].findall("testcase"))==sorted(expected[n]) for n in expected), "Unified exact-source two-OS PG17 JUnit matrix must be complete, zero skips"'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aic31b-unified-pg17-linux
          path: aic467-pg17-evidence/
          if-no-files-found: warn

  postgresql17-windows:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      AIC_TEST_POSTGRES_URL: postgresql+asyncpg://postgres:root@127.0.0.1:5432/aic_p1a
      AIC31B_EPHEMERAL_REHEARSAL: "1"
      AIC31B_EPHEMERAL_CRASH: "1"
      PGPASSWORD: root
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # pinned historical PR467 31a blob is mandatory
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
      - name: Start actual native Windows PostgreSQL 17 and isolated database
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $service = Get-Service -Name "postgresql-x64-17" -ErrorAction Stop
          Set-Service -Name $service.Name -StartupType Manual
          if ($service.Status -ne "Running") { Start-Service -Name $service.Name }
          if ((Get-Service -Name $service.Name).Status -ne "Running") { throw "PG17 service not running" }
          $psql = Join-Path $env:PGBIN "psql.exe"
          if (!(Test-Path $psql)) { throw "native PG17 psql missing" }
          $v = & $psql -h 127.0.0.1 -U postgres -d postgres -tAc "SHOW server_version_num"
          if ($LASTEXITCODE -ne 0 -or [int]($v.Trim()) -lt 170000 -or [int]($v.Trim()) -ge 180000) { throw "expected real PG17: $v" }
          & $psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE aic_p1a"
          if ($LASTEXITCODE -ne 0) { throw "CREATE DATABASE failed" }
      - name: Install real PG and suite dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements-test.txt
          python -m pip install asyncpg==0.32.0
      - name: Require actual PostgreSQL 17 server (no sqlite fallback)
        shell: pwsh
        run: |
          python -c 'import asyncio,os,asyncpg
          from sqlalchemy.engine.url import make_url
          async def check():
              u=make_url(os.environ["AIC_TEST_POSTGRES_URL"])
              c=await asyncpg.connect(host=u.host,port=u.port or 5432,user=u.username,password=u.password,database=u.database)
              try:
                  v=int(await c.fetchval("SHOW server_version_num"))
                  print("Real PG server_version_num:",v,flush=True)
                  assert 170000<=v<180000,"PostgreSQL 17 required"
              finally:
                  await c.close()
          asyncio.run(check())'
      - name: Run Windows AIC integration and architecture matrix, strict no skips
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path aic467-pg17-evidence | Out-Null
          python -m pytest -q -ra --junitxml=aic467-pg17-evidence/windows-junit.xml -k "not full_historical_alembic_chain_with_ubq25_26_and_live_owner" se/tests/integration/test_aic0_p1_agent_instance_identity.py se/tests/architecture/test_aic0_p1_identity_production_boundary.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c 'from xml.etree import ElementTree as E; r=E.parse("aic467-pg17-evidence/windows-junit.xml").getroot(); suites=[r] if r.tag=="testsuite" else r.findall("testsuite"); print([(x.get("tests"),x.get("failures"),x.get("errors"),x.get("skipped")) for x in suites]); assert all(int(x.get("skipped","0"))==0 and int(x.get("failures","0"))==0 and int(x.get("errors","0"))==0 for x in suites); assert sum("test_aic_pg17_hard_exit_live_and_permanent_marker" in c.get("name","") for s in suites for c in s.findall("testcase"))==3, "three native PG17 OS-kill tests REQUIRED"; assert sum("test_aic_pg17_forward_old31a_guard_and_restart" in c.get("name","") for s in suites for c in s.findall("testcase"))==1, "historical 31a -> 31b native PG17 repair gate REQUIRED"'
          if ($LASTEXITCODE -ne 0) { throw "Strict Windows JUnit gate failed before SQLite history" }
          python -m pytest -q -ra --junitxml=aic467-pg17-evidence/windows-history-sqlite.xml "se/tests/integration/test_aic0_p1_agent_instance_identity.py::test_aic_full_historical_alembic_chain_with_ubq25_26_and_live_owner[sqlite]"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c 'from xml.etree import ElementTree as E; r=E.parse("aic467-pg17-evidence/windows-history-sqlite.xml").getroot(); ss=[r] if r.tag=="testsuite" else r.findall("testsuite"); assert len(ss)==1 and all(int(ss[0].get(k,"0"))==v for k,v in {"tests":1,"failures":0,"errors":0,"skipped":0}.items()), "real SQLite historical gate must be exactly one PASS with zero skips"'
          if ($LASTEXITCODE -ne 0) { throw "Strict Windows SQLite history JUnit gate failed" }
      - name: Require native Windows composed, reader-writer and hard-exit cuts
        shell: pwsh
        run: |
          python -m pytest -q -ra --junitxml=aic467-pg17-evidence/windows-composed.xml se/tests/integration/test_aic0_31b_composed_alembic.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest -q -ra --junitxml=aic467-pg17-evidence/windows-quiescence.xml se/tests/integration/test_aic0_31b_quiescence_rehearsal.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest -q -ra --junitxml=aic467-pg17-evidence/windows-interrupt.xml se/tests/integration/test_aic0_31b_cli_interrupt.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c 'from xml.etree import ElementTree as E; expected={"composed":["test_composed_pg17_cli_old_stamped_31a_to_31b","test_composed_pg17_cli_pristine_ubq_history_to_31b"],"quiescence":["test_pg17_ephemeral_login_barrier_drain_and_old31a_forward[reader]","test_pg17_ephemeral_login_barrier_drain_and_old31a_forward[writer]"],"interrupt":["test_pg17_interrupted_31b_cli_fail_closed[after_commit]","test_pg17_interrupted_31b_cli_fail_closed[before_commit]"]}; suites={n:next(iter(E.parse("aic467-pg17-evidence/windows-"+n+".xml").getroot().iter("testsuite"))) for n in expected}; print({n:(suites[n].get("tests"),suites[n].get("failures"),suites[n].get("errors"),suites[n].get("skipped")) for n in expected}); assert all(int(suites[n].get("tests","-1"))==len(expected[n]) and all(int(suites[n].get(k,"0"))==0 for k in ("failures","errors","skipped")) and sorted(x.get("name") for x in suites[n].findall("testcase"))==sorted(expected[n]) for n in expected), "Unified exact-source two-OS PG17 JUnit matrix must be complete, zero skips"'
          if ($LASTEXITCODE -ne 0) { throw "Native Windows unified exact-HEAD PG17 matrix failed" }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aic31b-unified-pg17-windows
          path: aic467-pg17-evidence/
          if-no-files-found: warn
