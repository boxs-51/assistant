name: AE-R14 E-P1A Native Hard-Restart Evidence

on:
  pull_request:
    paths:
      - "se/tests/e2e/test_r14_e_sql_restart_agent_hitl_k1_k2.py"
      - "docs/agent_execution_r14/R14_E_P1_COMPOSED_P0_EXIT_MATRIX.md"
      - ".github/workflows/ae-r14-e-p1a-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

# Real OS child kill + SQLite E2E on both native hosts.
# DO NOT treat this as a PostgreSQL, pending-HITL or full P0 exit gate.
jobs:
  physical-hard-restart-sqlite:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: |
            requirements-test.txt
            requirements.txt
            requirements-runtime.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Run real child-process hard kill E-P1A witness
        run: >-
          python -m pytest -q -ra
          se/tests/e2e/test_r14_e_sql_restart_agent_hitl_k1_k2.py::test_r14_e_decided_high_risk_k1_terminal_recovers_after_real_s1_kill
