name: AE-R14 E-P1A Native Hard-Restart Evidence

on:
  pull_request:
    paths:
      - "se/tests/e2e/test_r14_e_sql_restart_agent_hitl_k1_k2.py"
      - "se/tests/e2e/r14_e_postgres17_hard_restart_evidence.py"
      - "docs/agent_execution_r14/R14_E_P1_COMPOSED_P0_EXIT_MATRIX.md"
      - ".github/workflows/ae-r14-e-p1a-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

# Real S1 OS kill/S2 new PID + durable SQL, real TCP K1/K2 on both OSes.
# PostgreSQL 17 is covered by dedicated jobs; pending HITL/UBQ remains HOLD.
jobs:
  physical-hard-restart-sqlite:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: |
            requirements-test.txt
            requirements.txt
            requirements-runtime.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Run real child-process hard kill E-P1A witness
        run: >-
          python -m pytest -q -ra
          se/tests/e2e/test_r14_e_sql_restart_agent_hitl_k1_k2.py

  # Docker service containers run on Linux hosts. PG remains alive while
  # independent S1 is killed, and S2 must reuse the same server database.
  physical-hard-restart-postgresql-ubuntu:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root
          POSTGRES_DB: r14e_p1a
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d r14e_p1a"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      R14_E_P1A_POSTGRES_URL: postgresql+asyncpg://postgres:root@127.0.0.1:5432/r14e_p1a
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: |
            requirements-test.txt
            requirements.txt
            requirements-runtime.txt
      - name: Install requirements plus asyncpg evidence-only driver
        run: |
          python -m pip install -r requirements-test.txt
          python -m pip install asyncpg==0.32.0
      - name: Prepare evidence directory for strict pytest basetemp
        run: python -c "from pathlib import Path; Path('ae-r14-e-pg-evidence').mkdir(exist_ok=True)"
      - name: Execute physical hard kill with PostgreSQL 17 (no skip)
        run: >-
          python -m pytest -q -ra
          --basetemp=ae-r14-e-pg-evidence/ubuntu
          --junitxml=ae-r14-e-pg-evidence/ubuntu-junit.xml
          se/tests/e2e/r14_e_postgres17_hard_restart_evidence.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r14-e-pg17-ubuntu-evidence
          path: ae-r14-e-pg-evidence/
          if-no-files-found: warn

  # The Windows Server 2025 GitHub image has PostgreSQL 17 installed, but the
  # actual Windows service is disabled/stopped; enable it explicitly.
  physical-hard-restart-postgresql-windows:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      R14_E_P1A_POSTGRES_URL: postgresql+asyncpg://postgres:root@127.0.0.1:5432/r14e_p1a
      PGPASSWORD: root
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: |
            requirements-test.txt
            requirements.txt
            requirements-runtime.txt
      - name: Start genuine native Windows PostgreSQL 17.11 service
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $service = Get-Service -Name 'postgresql-x64-17' -ErrorAction Stop
          Set-Service -Name $service.Name -StartupType Manual
          Start-Service -Name $service.Name
          $service = Get-Service -Name $service.Name
          if ($service.Status -ne 'Running') { throw "PostgreSQL service not running" }
          $psql = Join-Path $env:PGBIN 'psql.exe'
          if (!(Test-Path $psql)) { throw "PostgreSQL 17 psql binary missing" }
          $version = & $psql -h 127.0.0.1 -U postgres -d postgres -tAc "SHOW server_version_num"
          if ($LASTEXITCODE -ne 0 -or [int]($version.Trim()) -lt 170000 -or [int]($version.Trim()) -ge 180000) {
            throw "Real PostgreSQL 17 version check failed: $version"
          }
          & $psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE r14e_p1a"
          if ($LASTEXITCODE -ne 0) { throw "Failed to create isolated test database" }
      - name: Install requirements plus asyncpg evidence-only driver
        run: |
          python -m pip install -r requirements-test.txt
          python -m pip install asyncpg==0.32.0
      - name: Prepare evidence directory for strict pytest basetemp
        run: python -c "from pathlib import Path; Path('ae-r14-e-pg-evidence').mkdir(exist_ok=True)"
      - name: Execute native Windows hard kill with PostgreSQL 17 (no skip)
        run: >-
          python -m pytest -q -ra
          --basetemp=ae-r14-e-pg-evidence/windows
          --junitxml=ae-r14-e-pg-evidence/windows-junit.xml
          se/tests/e2e/r14_e_postgres17_hard_restart_evidence.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r14-e-pg17-windows-evidence
          path: ae-r14-e-pg-evidence/
          if-no-files-found: warn
