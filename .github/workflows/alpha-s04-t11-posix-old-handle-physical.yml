name: Alpha S04 T11 POSIX separate-UID SQLite open-handle physical

on:
  pull_request:
    paths:
      - "se/tests/integration/s04_t11_linux_posix_old_handle_physical.py"
      - ".github/workflows/alpha-s04-t11-posix-old-handle-physical.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  t11-disposable-posix:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      S04_T11_STRICT: "1"
      S04_T11_DISPOSABLE: "1"
      S04_T11_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
      - name: Install isolated pytest only
        run: python -m pip install "pytest==9.0.2"
      - name: Verify old UID and current exact HEAD
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$S04_T11_EXPECTED_SHA"
          id
          id nobody
          sudo -n -u nobody -- id
          python -m pytest --collect-only -q se/tests/integration/s04_t11_linux_posix_old_handle_physical.py > s04-t11-collection.txt
          grep -q "6 tests collected" s04-t11-collection.txt
      - name: Physical six-case POSIX old FD and path access test
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -v -ra --tb=short se/tests/integration/s04_t11_linux_posix_old_handle_physical.py --junitxml=s04-t11-raw.xml
      - name: Enforce six scenario identities and no false green
        if: always()
        shell: python
        run: |
          import xml.etree.ElementTree as ET
          from collections import Counter
          from pathlib import Path
          p=Path("s04-t11-raw.xml")
          assert p.is_file(), "S04_HARNESS_ERROR: raw identity evidence absent"
          root=ET.parse(p).getroot()
          suites=[root] if root.tag=="testsuite" else root.findall("testsuite")
          assert len(suites)==1
          cases=suites[0].findall("testcase")
          expected=Counter({
            f"test_t11_posix_legacy_old_uid_file_boundary[{var}-{purpose}]":1
            for var in ("new_connection","stale_restore","preexisting_handle")
            for purpose in ("registration","password_reset")
          })
          assert Counter(c.get("name") for c in cases)==expected, "S04_HARNESS_ERROR: exact identities missing/duplicate"
          assert len(cases)==6
          assert all(c.get("classname","").endswith("s04_t11_linux_posix_old_handle_physical") for c in cases)
          assert all(suites[0].get(k)==v for k,v in {"tests":"6","failures":"0","errors":"0","skipped":"0"}.items())
          assert all(c.find(k) is None for c in cases for k in ("failure","error","skipped"))
          print("S04_T11_POSIX_UID_6_PASS; PREEXISTING_FD_HAZARD_REPRODUCED; PRODUCT_HOLD")
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s04-t11-posix-file-handle-raw
          path: |
            s04-t11-raw.xml
            s04-t11-collection.txt
          if-no-files-found: error
