name: AE359 Remote UNKNOWN No-Retry Two-OS Contract

on:
  pull_request:
    paths:
      - "se/src/runtimes/capability/runtime.py"
      - "se/tests/architecture/test_ubq3_outcome_evidence.py"
      - ".github/workflows/ae359-remote-unknown-noretry-two-os.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  uncertain-remote-timeout:
    name: remote-unknown-noretry (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: |
            requirements-test.txt
            requirements.txt
            requirements-runtime.txt
      - name: Install baseline test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Create evidence directory
        run: python -c "from pathlib import Path; Path('evidence/ae359-remote-timeout').mkdir(parents=True, exist_ok=True)"
      - name: Remote outcome UNKNOWN cannot advertise retry
        run: >-
          python -m pytest -q -ra
          --junitxml=evidence/ae359-remote-timeout/junit.xml
          se/tests/architecture/test_ubq3_outcome_evidence.py::test_ubq3_remote_timeout_unknown_does_not_refund
      - name: Strict JUnit one-test zero-skips evidence
        run: >-
          python -c "import xml.etree.ElementTree as ET;
          root=ET.parse('evidence/ae359-remote-timeout/junit.xml').getroot();
          suites=[root] if root.tag=='testsuite' else list(root.findall('testsuite'));
          assert len(suites)==1 and
          int(suites[0].attrib.get('tests','0'))==1 and
          all(int(suites[0].attrib.get(k,'0'))==0 for k in ('failures','errors','skipped'));
          print('AE359_REMOTE_UNKNOWN_NORETRY=1_PASS_0_SKIP; PORTABLE_TWO_OS_NOT_NATIVE_EFFECT_FENCE')"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ae359-remote-timeout-${{ matrix.os }}
          path: evidence/ae359-remote-timeout
          if-no-files-found: error
