name: Alpha S02 Alembic Merge Physical RED-to-GREEN

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# Supersede stale PR checks for this workflow only; manual runs remain independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  sqlite-historical:
    name: SQLite history and owner negatives / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Attest checkout revision
        run: python -c "import os,subprocess; assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==os.environ['EXPECTED_HEAD']"
      - name: Run real SQLite FK/recursive matrix
        run: python -m pytest -q -ra se/tests/architecture/test_alpha_s02_merge_redfirst.py se/tests/integration/test_alpha_s02_sqlite_physical.py se/tests/integration/test_terminal_permission_provisioning_p1.py se/tests/integration/test_alpha_s02_recovery_sqlite.py --junitxml=s02-sqlite-physical.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s02-sqlite-${{ matrix.os }}-raw
          path: s02-sqlite-physical.xml
          if-no-files-found: warn
          retention-days: 7

  postgresql17-historical:
    name: Real PG17 both AIC and terminal histories / Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: s02_migration_ci
          POSTGRES_USER: s02_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U s02_ci -d s02_migration_ci"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 15
    env:
      ALPHA_S02_PG17_STRICT: "1"
      ALPHA_S02_PG17_URL: postgresql+asyncpg://s02_ci@127.0.0.1:5432/s02_migration_ci
      PYTHONDONTWRITEBYTECODE: "1"
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Attest exact HEAD and loopback database identity
        run: |
          python - <<'PY'
          import os, subprocess
          from sqlalchemy.engine import make_url
          assert subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip() == os.environ['EXPECTED_HEAD']
          u = make_url(os.environ['ALPHA_S02_PG17_URL'])
          assert (u.drivername, u.host, u.port, u.database, u.username, u.password) == (
              'postgresql+asyncpg', '127.0.0.1', 5432, 's02_migration_ci', 's02_ci', None
          )
          PY
      - name: Run strict real PostgreSQL 17 historical migrations
        run: python -m pytest -q -ra se/physical/s02_pg17_physical.py se/physical/s02_pg17_recovery.py --junitxml=s02-pg17-physical.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s02-pg17-linux-raw
          path: s02-pg17-physical.xml
          if-no-files-found: warn
          retention-days: 7
