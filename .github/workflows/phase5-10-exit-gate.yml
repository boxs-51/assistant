name: Phase 5.10 Exit Gate

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  phase-5-10-exit-gate:
    name: Phase 5.10 exit gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"

      - name: Install dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Run full test suite
        run: python -m pytest -q

      - name: Run Phase 5.10 exit gate
        working-directory: se
        run: python -m pytest -q cl/tests/architecture/test_phase5_10_exit_gate.py
