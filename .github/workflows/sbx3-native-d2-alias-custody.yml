name: SBX3 Native D2 Alias Receipt and Root Custody RED-first

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-d2-negative:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
      - run: python -m pip install -r requirements-test.txt
      - name: Native D2 negative gates without native process execution
        run: >-
          python -m pytest -q -ra
          se/tests/architecture/test_native_d2_alias_custody_redfirst.py
          --junitxml=native-d2-negative.xml
      - name: Strict D2 oracle identity and no-skip JUnit admission
        if: always()
        shell: python
        run: |
          from collections import Counter
          from pathlib import Path
          from xml.etree import ElementTree as ET
          path = Path("native-d2-negative.xml")
          assert path.exists(), "HARNESS_ERROR: Native D2 JUnit missing"
          root = ET.parse(path).getroot()
          suites = [root] if root.tag == "testsuite" else list(root.findall("testsuite"))
          cases = [case for suite in suites for case in suite.findall("testcase")]
          found = Counter(case.attrib["name"].split("[", 1)[0] for case in cases)
          assert found == Counter({
              "test_d2_alias_success_never_crosses_native_receipt_gate": 3,
              "test_d2_error_outcomes_remain_reportable": 6,
              "test_d2_restarted_manager_cannot_delete_orphaned_native_root": 1,
          }), ("HARNESS_ERROR: missing/duplicate Native D2 security oracle", found)
          bad = {k: sum(case.find(k) is not None for case in cases)
                 for k in ("failure", "error", "skipped")}
          assert len(cases) == 10 and all(value == 0 for value in bad.values()), (
              "NATIVE_D2_SEMANTIC_RED", bad
          )
          print("NATIVE_D2=10_PASS_0_FAIL_0_ERROR_0_SKIP; PORTABLE_NOT_OS_CONFINEMENT")
      - name: Preserve raw JUnit on RED and GREEN
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-d2-negative-${{ matrix.os }}
          path: native-d2-negative.xml
          if-no-files-found: error
