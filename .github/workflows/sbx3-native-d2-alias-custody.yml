name: SBX3 Native D2 Alias Receipt and Root Custody RED-first

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-d2-negative:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
      - run: python -m pip install -r requirements-test.txt
      - name: Native D2 negative gates without native process execution
        run: >-
          python -m pytest -q -ra
          se/tests/architecture/test_native_d2_alias_custody_redfirst.py
          --junitxml=native-d2-negative.xml
      - name: Preserve raw JUnit on RED and GREEN
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-d2-negative-${{ matrix.os }}
          path: native-d2-negative.xml
          if-no-files-found: error
