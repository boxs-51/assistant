name: Architecture Baseline

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  linux-full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        # Disposable PostgreSQL 17 for strict AE359 integration oracles.
        # Release admission still requires an immutable image digest.
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ae359_otp_t1
          POSTGRES_USER: ae359_test
          POSTGRES_PASSWORD: ae359_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ae359_test -d ae359_otp_t1"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 15
    env:
      AE359_TZ_PG17_STRICT: "1"
      AE359_TZ_PG17_URL: postgresql+asyncpg://ae359_test:ae359_test_only@127.0.0.1:5432/ae359_otp_t1
      AE359_PG17_STRICT: "1"
      AE359_PG17_TEST_DATABASE_URL: postgresql+asyncpg://ae359_test:ae359_test_only@127.0.0.1:5432/ae359_otp_t1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: |
            requirements-test.txt
            requirements.txt
            requirements-runtime.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Run full suite
        run: python -m pytest -q

  windows-client-contracts:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: |
            requirements-test.txt
            requirements.txt
            requirements-runtime.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Run client contracts
        run: python -m pytest -q cl/tests

  # Portable SE/Tools Windows baseline only; NOT SBX-3 OS containment proof.
  windows-server-sandbox-baseline:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: |
            requirements-test.txt
            requirements.txt
            requirements-runtime.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Run portable SE and Tools Windows baseline
        run: >-
          python -m pytest -q -ra
          se/tests/integration/test_sbx1_sandbox_manager.py
          se/tests/integration/test_sbx2_sandbox_file_glob_execution.py
          tools/v1/test/test_terminal_tool.py
          tools/v1/test/test_t12_a_sbx3_terminal_python_contract.py
