name: Architecture Baseline

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  linux-full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Keep UBQ2 PostgreSQL parity/deployment tripwire unchanged: no PG fixture here.
    # AE359 physical suites run in separate, unfiltered PR workflows.
    # GitHub required-status-check admission is a separate merge gate.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: |
            requirements-test.txt
            requirements.txt
            requirements-runtime.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Run baseline suite (AE359 physical fixtures run independently)
        run: >-
          python -m pytest -q
          --ignore=se/tests/integration/test_ae359_utc_naive_pg17_redfirst.py
          --ignore=se/tests/integration/test_auth_otp_db_atomic_consume_pg17_redfirst.py
          --ignore=se/tests/integration/test_ae359_post_ack_loss_physical.py

  windows-client-contracts:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: |
            requirements-test.txt
            requirements.txt
            requirements-runtime.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Run client contracts
        run: python -m pytest -q cl/tests

  # Portable SE/Tools Windows baseline only; NOT SBX-3 OS containment proof.
  windows-server-sandbox-baseline:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: |
            requirements-test.txt
            requirements.txt
            requirements-runtime.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Run portable SE and Tools Windows baseline
        run: >-
          python -m pytest -q -ra
          se/tests/integration/test_sbx1_sandbox_manager.py
          se/tests/integration/test_sbx2_sandbox_file_glob_execution.py
          tools/v1/test/test_terminal_tool.py
          tools/v1/test/test_t12_a_sbx3_terminal_python_contract.py
