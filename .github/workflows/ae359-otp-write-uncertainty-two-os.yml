name: AE359 OTP Write Uncertainty Two-OS
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  otp-uncertainty:
    name: AE359 OTP uncertainty strict / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      AE359_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout exact candidate HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
      - name: Install pinned test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Attest exact HEAD
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$AE359_EXPECTED_SHA"
          echo "AE359_UNCERTAINTY_EXACT_HEAD=$(git rev-parse HEAD)"
      - name: Run strict portable Redis uncertainty semantics
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q -ra --tb=short se/tests/integration/test_ae359_otp_write_uncertainty_matrix.py --junitxml=ae359-otp-uncertainty.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("ae359-otp-uncertainty.xml").getroot()
          suites = [root] if root.tag == "testsuite" else list(root.iter("testsuite"))
          tests = sum(int(x.attrib.get("tests", 0)) for x in suites)
          failed = sum(int(x.attrib.get("failures", 0)) for x in suites)
          errors = sum(int(x.attrib.get("errors", 0)) for x in suites)
          skips = sum(int(x.attrib.get("skipped", 0)) for x in suites)
          print(f"AE359_OTP_UNCERTAINTY_RECEIPT={tests} FAIL={failed} ERROR={errors} SKIP={skips}")
          assert (tests, failed, errors, skips) == (34, 0, 0, 0)
          PY
      - name: Preserve raw two-OS JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ae359-otp-uncertainty-${{ matrix.os }}-raw
          path: ae359-otp-uncertainty.xml
          if-no-files-found: warn
          retention-days: 7
