name: Alpha S03 CAS Owner and Immutable Guards

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cas-owner-fence:
    name: CAS immutable and hydration drift / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Attest exact HEAD
        run: python -c "import os,subprocess; assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==os.environ['EXPECTED_HEAD']"
      - name: Run existing CAS owner and immutable regressions
        run: python -m pytest -q -ra se/tests/architecture/test_cas_f5_1_binding_foundation.py se/tests/architecture/test_f2_asset_service.py se/tests/architecture/test_cas_f5_c_dormant_hydration.py --junitxml=s03-cas-junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s03-cas-${{ matrix.os }}-raw
          path: s03-cas-junit.xml
          if-no-files-found: warn
          retention-days: 7
