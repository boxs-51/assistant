name: AIC31b Ephemeral Quiescence PG17 Linux Windows

on:
  push:
    branches:
      - evidence/156-426-aic31b-quiescence-pg17-20261013
  pull_request:
    paths:
      - ".github/workflows/aic31b-quiescence-rehearsal-pg17.yml"
      - "se/tests/integration/test_aic0_31b_quiescence_rehearsal.py"
  workflow_dispatch:

permissions:
  contents: read

# Scope: disposable PG17 CI database + dynamically created test roles ONLY.
# A PostgreSQL NOLOGIN rehearsal does NOT prove the production fleet admission
# barrier, worker drain, least-privilege config, or crash-recovery procedure.
# No production activation, canonical source promotion or merge authorization.
jobs:
  postgresql17-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root
          POSTGRES_DB: aic_p1a
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aic_p1a"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      AIC_TEST_POSTGRES_URL: postgresql+asyncpg://postgres:root@127.0.0.1:5432/aic_p1a
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # pinned historical PR467 31a blob is mandatory
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
      - name: Install real PG and suite dependencies
        run: |
          python -m pip install -r requirements-test.txt
          python -m pip install asyncpg==0.32.0
      - name: Require actual PostgreSQL 17 server (no sqlite fallback)
        shell: bash
        run: |
          python -c 'import asyncio,os,asyncpg
          from sqlalchemy.engine.url import make_url
          async def check():
              u=make_url(os.environ["AIC_TEST_POSTGRES_URL"])
              c=await asyncpg.connect(host=u.host,port=u.port or 5432,user=u.username,password=u.password,database=u.database)
              try:
                  v=int(await c.fetchval("SHOW server_version_num"))
                  print("Real PG server_version_num:",v,flush=True)
                  assert 170000<=v<180000,"PostgreSQL 17 required"
              finally:
                  await c.close()
          asyncio.run(check())'
      - name: Rehearse PG17 reader-writer drain and login barrier
        shell: bash
        run: |
          mkdir -p aic31b-quiescence-evidence
          python -m pytest -q -ra --junitxml=aic31b-quiescence-evidence/linux-junit.xml se/tests/integration/test_aic0_31b_quiescence_rehearsal.py
          python -c 'from xml.etree import ElementTree as E; r=E.parse("aic31b-quiescence-evidence/linux-junit.xml").getroot(); s=[r] if r.tag=="testsuite" else r.findall("testsuite"); print([(x.get("tests"),x.get("failures"),x.get("errors"),x.get("skipped")) for x in s]); assert len(s)==1 and all(int(s[0].get(k,"0"))==v for k,v in {"tests":2,"failures":0,"errors":0,"skipped":0}.items()), "both real PG17 role/lock rehearsal tests required"; assert sorted(c.get("name") for c in s[0].findall("testcase")) == ["test_pg17_ephemeral_login_barrier_drain_and_old31a_forward[reader]","test_pg17_ephemeral_login_barrier_drain_and_old31a_forward[writer]"], "exact reader/writer sessions are mandatory"'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aic31b-quiescence-linux
          path: aic31b-quiescence-evidence/
          if-no-files-found: warn

  postgresql17-windows:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      AIC_TEST_POSTGRES_URL: postgresql+asyncpg://postgres:root@127.0.0.1:5432/aic_p1a
      PGPASSWORD: root
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # pinned historical PR467 31a blob is mandatory
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
      - name: Start actual native Windows PostgreSQL 17 and isolated database
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $service = Get-Service -Name "postgresql-x64-17" -ErrorAction Stop
          Set-Service -Name $service.Name -StartupType Manual
          if ($service.Status -ne "Running") { Start-Service -Name $service.Name }
          if ((Get-Service -Name $service.Name).Status -ne "Running") { throw "PG17 service not running" }
          $psql = Join-Path $env:PGBIN "psql.exe"
          if (!(Test-Path $psql)) { throw "native PG17 psql missing" }
          $v = & $psql -h 127.0.0.1 -U postgres -d postgres -tAc "SHOW server_version_num"
          if ($LASTEXITCODE -ne 0 -or [int]($v.Trim()) -lt 170000 -or [int]($v.Trim()) -ge 180000) { throw "expected real PG17: $v" }
          & $psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE aic_p1a"
          if ($LASTEXITCODE -ne 0) { throw "CREATE DATABASE failed" }
      - name: Install real PG and suite dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements-test.txt
          python -m pip install asyncpg==0.32.0
      - name: Require actual PostgreSQL 17 server (no sqlite fallback)
        shell: pwsh
        run: |
          python -c 'import asyncio,os,asyncpg
          from sqlalchemy.engine.url import make_url
          async def check():
              u=make_url(os.environ["AIC_TEST_POSTGRES_URL"])
              c=await asyncpg.connect(host=u.host,port=u.port or 5432,user=u.username,password=u.password,database=u.database)
              try:
                  v=int(await c.fetchval("SHOW server_version_num"))
                  print("Real PG server_version_num:",v,flush=True)
                  assert 170000<=v<180000,"PostgreSQL 17 required"
              finally:
                  await c.close()
          asyncio.run(check())'
      - name: Rehearse Windows PG17 reader-writer drain and login barrier
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path aic31b-quiescence-evidence | Out-Null
          python -m pytest -q -ra --junitxml=aic31b-quiescence-evidence/windows-junit.xml se/tests/integration/test_aic0_31b_quiescence_rehearsal.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c 'from xml.etree import ElementTree as E; r=E.parse("aic31b-quiescence-evidence/windows-junit.xml").getroot(); s=[r] if r.tag=="testsuite" else r.findall("testsuite"); print([(x.get("tests"),x.get("failures"),x.get("errors"),x.get("skipped")) for x in s]); assert len(s)==1 and all(int(s[0].get(k,"0"))==v for k,v in {"tests":2,"failures":0,"errors":0,"skipped":0}.items()), "both real PG17 role/lock rehearsal tests required"; assert sorted(c.get("name") for c in s[0].findall("testcase")) == ["test_pg17_ephemeral_login_barrier_drain_and_old31a_forward[reader]","test_pg17_ephemeral_login_barrier_drain_and_old31a_forward[writer]"], "exact reader/writer sessions are mandatory"'
          if ($LASTEXITCODE -ne 0) { throw "Windows strict composed 31b CLI JUnit gate failed" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aic31b-quiescence-windows
          path: aic31b-quiescence-evidence/
          if-no-files-found: warn
